# AUTOGENERATED by rl3-templates baseline. Do not hand-edit between
# `# rl3-templates: managed BEGIN` and `# rl3-templates: managed END`.
# Customise via .copier-answers.yml + `copier update`.
#
# Install:        pre-commit install --install-hooks
# Run all:        pre-commit run --all-files
# Update versions: pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [ pre-commit ]
fail_fast: false

# rl3-templates: managed BEGIN
exclude: |
  (?x)^(
    node_modules/
    | dist/
    | build/
    | \.venv/
    | \.agents/
    | \.claude/
    | \.cline/
    | \.codi/
    | \.codex/
    | \.cursor/
    | \.windsurf/
    | frontend/src/client/.*
    | frontend/src/routeTree\.gen\.ts
    | backend/app/email-templates/build/.*
    | backend/app/alembic/versions/.*\.py$
    | docs/evidence/
  )

repos:
  # ─── Block 1: hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ "--fix=lf" ]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-yaml
        args: [ "--unsafe" ]
      - id: check-toml
      - id: check-json
        exclude: 'tsconfig.*\.json$'
      - id: check-added-large-files
        args: [ "--maxkb=1000" ]
      - id: detect-private-key
      - id: debug-statements
        files: '\.py$'
      - id: no-commit-to-branch
        args:
          - "--branch=main"
          - "--branch=develop"
          - "--pattern=^release/"
      - id: check-executables-have-shebangs

  # ─── Block 2: secrets + supply chain ────────────────────────────────────
  # Order: fail-fast cheapest-first.
  #   1. forbid-env-file / forbid-credentials   — instant `language: fail` glob check
  #   2. scan-agent-configs                     — bash, ~50ms
  #   3. gitleaks                               — single binary, scales with diff size (slowest in block)
  - repo: local
    hooks:
      - id: forbid-env-file
        name: forbid committing .env / .env.* (use .env.example)
        entry: ".env / .env.* must not be committed"
        language: fail
        files: '(^|/)\.env(\.[^/]+)?$'
        exclude: '\.env\.example$'

      - id: forbid-credentials
        name: forbid committing private keys, certs, credentials
        entry: "private keys, certificates, and credentials must not be committed"
        language: fail
        files: '\.(pem|key|p12|pfx|jks|keystore)$|/id_rsa$|/credentials\.json$'

      - id: scan-agent-configs
        name: scan agent / MCP config files for secrets (Sandworm-mode mitigation)
        entry: bash scripts/hooks/scan-agent-configs.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: block-junk-paths
        name: refuse to commit node_modules, dist, .venv, etc.
        entry: bash scripts/hooks/block-junk-paths.sh
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: [ "--no-banner" ]

  # ─── Block 3: anti-slop (AI-specific tier) ──────────────────────────────
  - repo: local
    hooks:
      - id: file-line-cap
        name: file size cap (700 lines)
        entry: python3 scripts/hooks/check_file_lines.py --cap=700
        language: system
        types_or: [ python, ts, tsx, javascript, jsx, go, rust ]

      - id: orphan-todo
        name: TODO without ticket reference
        entry: |
          bash -c '
            failed=0
            for f in "$@"; do
              if grep -nE "TODO([^(]|$)" "$f" 2>/dev/null \
                 | grep -vE "TODO\([A-Z][A-Z0-9]{1,7}-[0-9]+\)" >/dev/null; then
                echo "$f: orphan TODO — use TODO(CBP-N)"
                grep -nE "TODO([^(]|$)" "$f" \
                  | grep -vE "TODO\([A-Z][A-Z0-9]{1,7}-[0-9]+\)" || true
                failed=1
              fi
            done
            exit $failed
          ' --
        language: system
        types: [ text ]
        # Documentation files describe the rule by mentioning "TODO" — they
        # would otherwise trigger this hook on every commit.
        exclude: '^(CLAUDE\.md|\.pre-commit-config\.yaml|docs/.*_\[GUIDE\]_.*\.md|docs/.*_\[PLAN\]_.*\.md)$'

      - id: not-implemented-stub
        name: forbid NotImplementedError / "not implemented" stubs
        entry: |
          bash -c '
            failed=0
            for f in "$@"; do
              if grep -nE "(raise +NotImplementedError|throw +new +Error\(.not implemented)" "$f" 2>/dev/null; then
                echo "$f: NotImplementedError stub committed"
                failed=1
              fi
            done
            exit $failed
          ' --
        language: system
        types: [ text ]

      - id: forbid-coauthor-claude
        name: forbid Co-Authored-By Claude in committed content
        entry: |
          bash -c '
            failed=0
            for f in "$@"; do
              if grep -nE "Co-Authored-By: *(Claude|claude|noreply@anthropic)" "$f" 2>/dev/null; then
                echo "$f: forbidden Co-Authored-By Claude trailer"
                failed=1
              fi
            done
            exit $failed
          ' --
        language: system
        types: [ text ]
        # Documentation files describe the rule by mentioning the trailer —
        # they would otherwise trigger this hook on every commit.
        exclude: '^(CLAUDE\.md|docs/.*_\[GUIDE\]_.*\.md|docs/.*_\[PLAN\]_.*\.md)$'

      - id: forbid-edits-to-generated
        name: block manual edits to generated files
        entry: "this file is generated — do not hand-edit"
        language: fail
        # .copier-answers.yml is intentionally NOT listed here — it is created
        # on the bootstrap commit and refreshed on every `copier update`. The
        # Layer-B guard-write.sh hook (Claude PreToolUse) is the right gate to
        # catch agent edits to this file.
        files: |
          (?x)^(
            frontend/src/routeTree\.gen\.ts$
            | frontend/src/client/.*
            |
            .*_pb2\.py$
          )
        # NOTE: ``*.lock`` was intentionally removed from this regex.
        # Lockfiles (``backend/uv.lock``) DO get regenerated as part of
        # normal pin-bump flows (``uv lock``/``uv add``); blocking them
        # forces ``--no-verify`` on every dep change, which defeats the
        # purpose of the gate. Hand-edits to lockfiles are caught at
        # PR review (the diff is huge and obvious).

        # ─── Block 4: Python ────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [ "--fix" ]
        files: '^backend/'
      - id: ruff-format
        files: '^backend/'

  - repo: local
    hooks:
      - id: ruff-restage
        name: re-stage files auto-fixed by ruff
        entry: bash -c 'git diff --name-only --diff-filter=M -- "*.py" | xargs -r git
          add'
        language: system
        types: [ python ]
        pass_filenames: false

      - id: pyright
        name: pyright (type check)
        entry: bash -c 'cd backend && uv run pyright app/'
        language: system
        files: '^backend/.*\.py$'
        pass_filenames: false

  # ─── Block 5: TypeScript / frontend ─────────────────────────────────────
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (lint + format)
        entry: |
          bash -c '
            cd frontend && pnpm exec biome check \
              --write --no-errors-on-unmatched --files-ignore-unknown=true "$@"
          ' --
        language: system
        files: '^frontend/.*\.(ts|tsx|js|jsx|json|jsonc|css)$'
        exclude: '^frontend/(dist|src/routeTree\.gen\.ts|src/client)/'

  # ─── Block 6: infra / docs ──────────────────────────────────────────────

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [ "--config-file", ".yamllint.yaml" ]
        files: '\.(ya?ml)$'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/crate-ci/typos
    rev: v1.30.0
    hooks:
      - id: typos

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [ "-S", "warning" ]

  # ─── Block 7: commit-msg + pre-push tier ────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        # conventional-pre-commit v4.x takes types as POSITIONAL args, not
        # --types=joined. The joined form fails with "unrecognized arguments".
        args:
          - --strict
          - feat
          - fix
          - docs
          - refactor
          - test
          - chore
          - perf
          - ci
          - build
          - style
          - revert

  - repo: local
    hooks:
      - id: commit-msg-no-coauthor-claude
        name: reject Co-Authored-By Claude in commit message
        entry: |
          bash -c '
            grep -qE "Co-Authored-By: *(Claude|claude|noreply@anthropic)" "$1" \
              && { echo "ERROR: Co-Authored-By Claude is forbidden"; exit 1; } \
              || exit 0
          ' --
        language: system
        stages: [ commit-msg ]

      - id: commit-msg-length
        name: first line of commit message must be <= 72 chars
        entry: |
          bash -c '
            head -1 "$1" | awk "length > 72 { print \"ERROR: first line of commit message exceeds 72 chars (\"length\")\"; exit 1 }"
          ' --
        language: system
        stages: [ commit-msg ]

      # Branch policy (pre-push) — disabled when enable_branch_policy=false
      - id: branch-naming
        name: branch name <prefix>/<git-username>/<slug>
        entry: bash scripts/hooks/check-branch-name.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-push ]

      - id: no-direct-push
        name: refuse direct push to main or develop
        entry: bash scripts/hooks/no-direct-push.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-push ]

      - id: branch-source-base
        name: feature/* descend from develop, hotfix/* from main
        entry: bash scripts/hooks/check-branch-base.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [ pre-push ]
  - repo: local # managed by codi
    hooks:
      - id: version-bump
        name: version-bump
        entry: node .git/hooks/codi-version-bump.mjs
        language: system
        pass_filenames: false
        # Version bumps run at pre-push only — not every commit.
        stages:
          - pre-push
  - repo: local # managed by codi
    hooks:
      - id: version-verify
        name: version-verify
        entry: node .git/hooks/codi-version-verify.mjs
        language: system
        pass_filenames: false
        stages:
          - pre-push
        always_run: true
  - repo: local # managed by codi
    hooks:
      - id: staged-junk-check
        name: staged-junk-check
        entry: node .git/hooks/codi-staged-junk-check.mjs
        language: system
        always_run: true
  - repo: local # managed by codi
    hooks:
      - id: conflict-marker-check
        name: conflict-marker-check
        entry: node .git/hooks/codi-conflict-marker-check.mjs
        language: system
        always_run: true
  - repo: local # managed by codi
    hooks:
      - id: file-size-check
        name: file-size-check
        entry: node .git/hooks/codi-file-size-check.mjs
        language: system
        always_run: true
  - repo: local # managed by codi
    hooks:
      - id: import-depth-check
        name: import-depth-check
        entry: node .git/hooks/codi-import-depth-check.mjs
        language: system
  - repo: local # managed by codi
    hooks:
      - id: doc-naming-check
        name: doc-naming-check
        entry: node .git/hooks/codi-doc-naming-check.mjs
        language: system
  # gitleaks dedupe: codi-managed v8.21.0 removed; rl3-templates baseline
  # entry at line 98 (v8.30.0) is the single source of truth.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook # managed by codi
    rev: v9.23.0
    hooks:
      - id: commitlint
        additional_dependencies:
          - "@commitlint/config-conventional"
        stages:
          - commit-msg
  - repo: local # managed by codi
    hooks:
      - id: secret-scan
        name: secret-scan
        entry: node .git/hooks/codi-secret-scan.mjs
        language: system
        always_run: true
  - repo: local # managed by codi
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
  - repo: https://github.com/pre-commit/mirrors-prettier # managed by codi
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
  # shellcheck dedupe: codi-managed v0.10.0 entry removed; rl3-templates
  # baseline entry at line 257 is the single source of truth.
  - repo: local # managed by codi
    hooks:
      - id: tsc
        name: tsc
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        stages:
          - pre-push
  # ruff dedupe: codi-managed v0.15.12 unscoped entries removed; rl3-templates
  # baseline entries at lines 193-205 (v0.15.9, scoped to ^backend/) are the
  # single source of truth. To bump ruff version, update rl3-templates first.
  - repo: local # managed by codi
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: python
        additional_dependencies:
          - basedpyright
        pass_filenames: false
        stages:
          - pre-push
  - repo: https://github.com/PyCQA/bandit # managed by codi
    rev: 1.8.0
    hooks:
      - id: bandit
        args:
          - -c
          - pyproject.toml
          - -lll
        additional_dependencies:
          - bandit[toml]
        # Bandit at pre-push (slow, full-tree scan). v1-sprint-gates rule.
        stages:
          - pre-push
  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        # pip-audit at pre-push only — scans installed deps, not staged files.
        # Required by v1-sprint-gates rule for V1 ship gate.
        stages:
          - pre-push
        args:
          - --requirement
          - backend/pyproject.toml
          - --skip-editable
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
minimum_pre_commit_version: 3.5.0

# rl3-templates: managed END
